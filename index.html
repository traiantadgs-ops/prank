<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        html, body {
            margin: 0; padding: 0; height: 100%;
            background: #000; overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #start-screen {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: #000; cursor: pointer; z-index: 99999;
        }
        #start-screen h1 {
            font-size: 22px; color: #fff; margin-bottom: 30px;
        }
        #green-btn {
            background: #00cc44; color: #fff; border: none;
            padding: 18px 40px; font-size: 20px;
            border-radius: 8px; cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 204, 68, 0.6);
        }
        #green-btn:hover { background: #00ff55; }
        #video-container {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1; display: none; background: #000;
        }
        #fullscreen-video {
            width: 100%; height: 100%; object-fit: cover;
        }
        .hidden { display: none !important; }

        /* Маленькие мерцающие чёрно-белые окна */
        .virus-window {
            position: fixed;
            background: #000;
            border: 2px solid white;
            color: white;
            font-family: monospace;
            text-align: center;
            padding: 8px;
            z-index: 9999;
            box-shadow: 0 0 15px white;
            animation: blink 0.25s infinite, shake 0.15s infinite;
            user-select: none;
            pointer-events: none;
            font-weight: bold;
        }
        .virus-window h3 {
            margin: 0;
            font-size: 16px;
            line-height: 1;
        }
        .virus-window p {
            margin: 4px 0 0 0;
            font-size: 12px;
            line-height: 1;
        }
        @keyframes blink {
            0% {
                color: white;
                border-color: white;
                background: black;
                box-shadow: 0 0 15px white;
            }
            50% {
                color: black;
                border-color: black;
                background: white;
                box-shadow: 0 0 15px black;
            }
            100% {
                color: white;
                border-color: white;
                background: black;
                box-shadow: 0 0 15px white;
            }
        }
        @keyframes shake {
            0% { transform: translate(0, 0); }
            25% { transform: translate(2px, 2px); }
            50% { transform: translate(-2px, -2px); }
            75% { transform: translate(2px, -2px); }
            100% { transform: translate(0, 0); }
        }

        #stop-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 999999;
            background: red;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            display: none;
            font-family: monospace;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="start-screen" onclick="startVideo()">
        <h1>Загрузка контента...</h1>
        <button id="green-btn" onclick="event.stopPropagation(); startVideo();">
            ▶ Нажми, чтобы показать
        </button>
    </div>

    <div id="video-container">
        <video id="fullscreen-video" loop playsinline>
            <source src="video.mp4" type="video/mp4">
        </video>
    </div>

    <button id="stop-btn" onclick="stopEverything()">STOP</button>

    <script>
        var started = false;
        var windowsInterval = null;
        var windowCount = 0;
        var MAX_WINDOWS = 80;

        function startVideo() {
            if (started) return;
            started = true;

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('video-container').style.display = 'block';

            var video = document.getElementById('fullscreen-video');
            video.muted = false;
            video.volume = 1.0;
            video.play().catch(function(e) {
                console.log('Ошибка автоплея:', e);
            });

            document.getElementById('stop-btn').style.display = 'block';

            startVirusWindows();
        }

        function startVirusWindows() {
            createVirusWindow();

            windowsInterval = setInterval(function() {
                if (windowCount >= MAX_WINDOWS) {
                    clearInterval(windowsInterval);
                    return;
                }
                createVirusWindow();
            }, 200);
        }

        function createVirusWindow() {
            windowCount++;
            var win = document.createElement('div');
            win.className = 'virus-window';

            var w = 120 + Math.floor(Math.random() * 60);
            var h = 60 + Math.floor(Math.random() * 30);

            var maxX = window.innerWidth - w;
            var maxY = window.innerHeight - h;
            var x = Math.max(0, Math.floor(Math.random() * maxX));
            var y = Math.max(0, Math.floor(Math.random() * maxY));

            win.style.left = x + 'px';
            win.style.top = y + 'px';
            win.style.width = w + 'px';
            win.style.height = h + 'px';

            win.innerHTML = '<h3>YOU ARE AN IDIOT</h3><p>#' + windowCount + '</p>';

            document.body.appendChild(win);
        }

        function stopEverything() {
            if (windowsInterval) {
                clearInterval(windowsInterval);
                windowsInterval = null;
            }
            var wins = document.querySelectorAll('.virus-window');
            for (var i = 0; i < wins.length; i++) {
                wins[i].remove();
            }
            document.getElementById('stop-btn').style.display = 'none';
        }
    </script>
</body>
</html>
