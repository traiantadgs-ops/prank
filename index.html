<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        html, body {
            margin: 0; padding: 0; height: 100%;
            background: #000; overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #start-screen {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: #000; cursor: pointer; z-index: 99999;
        }
        #start-screen h1 {
            font-size: 22px; color: #fff; margin-bottom: 30px;
        }
        #green-btn {
            background: #00cc44; color: #fff; border: none;
            padding: 18px 40px; font-size: 20px;
            border-radius: 8px; cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 204, 68, 0.6);
        }
        #green-btn:hover { background: #00ff55; }
        #video-container {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1; display: none; background: #000;
        }
        #fullscreen-video {
            width: 100%; height: 100%; object-fit: cover;
        }
        .hidden { display: none !important; }

        .virus-window {
            position: fixed;
            background: #000;
            border: 3px solid red;
            color: red;
            font-family: monospace;
            text-align: center;
            padding: 20px;
            z-index: 9999;
            box-shadow: 0 0 30px red;
            animation: blink 0.4s infinite, shake 0.15s infinite;
            user-select: none;
            cursor: pointer;
        }
        .virus-window h2 {
            margin: 0 0 10px 0;
            font-size: 32px;
        }
        .virus-window p {
            margin: 0;
            font-size: 18px;
        }
        @keyframes blink {
            0% { color: red; border-color: red; }
            50% { color: black; border-color: black; }
            100% { color: red; border-color: red; }
        }
        @keyframes shake {
            0% { transform: translate(0, 0); }
            25% { transform: translate(3px, 3px); }
            50% { transform: translate(-3px, -3px); }
            75% { transform: translate(3px, -3px); }
            100% { transform: translate(0, 0); }
        }

        #stop-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 99999;
            background: red;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            display: none;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div id="start-screen" onclick="startVideo()">
        <h1>Загрузка контента...</h1>
        <button id="green-btn" onclick="event.stopPropagation(); startVideo();">
            ▶ Нажми, чтобы показать
        </button>
    </div>

    <div id="video-container">
        <video id="fullscreen-video" loop playsinline>
            <source src="video.mp4" type="video/mp4">
        </video>
    </div>

    <button id="stop-btn" onclick="stopEverything()">STOP</button>

    <script>
        var started = false;
        var internalInterval = null;
        var popupInterval = null;
        var windowCount = 0;
        var popupCount = 0;
        var MAX_WINDOWS = 40;
        var MAX_POPUPS = 20;
        var popupsBlocked = false;

        function startVideo() {
            if (started) return;
            started = true;

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('video-container').style.display = 'block';

            var video = document.getElementById('fullscreen-video');
            video.muted = false;
            video.volume = 1.0;
            video.play().catch(function(e) {
                console.log('Ошибка автоплея:', e);
            });

            document.getElementById('stop-btn').style.display = 'block';

            // Пытаемся открыть настоящие окна
            tryOpenPopups();
        }

        // === Попытка открыть попапы. Если не получилось — внутренние окна ===
        function tryOpenPopups() {
            // Пробуем первое окно
            var testPopup = null;
            try {
                testPopup = window.open('', '_blank', 'width=600,height=500');
            } catch(e) {
                testPopup = null;
            }

            if (testPopup && !testPopup.closed) {
                // Попапы РАЗРЕШЕНЫ — открываем их серией
                writePopupContent(testPopup, 0);
                popupInterval = setInterval(function() {
                    if (popupCount >= MAX_POPUPS) {
                        clearInterval(popupInterval);
                        return;
                    }
                    popupCount++;
                    try {
                        var w = window.open('', '_blank', 'width=450,height=400');
                        if (w) {
                            writePopupContent(w, popupCount);
                        } else {
                            // Браузер перестал разрешать — переключаемся на внутренние
                            if (!popupsBlocked) {
                                popupsBlocked = true;
                                clearInterval(popupInterval);
                                startInternalWindows();
                            }
                        }
                    } catch(e) {
                        if (!popupsBlocked) {
                            popupsBlocked = true;
                            clearInterval(popupInterval);
                            startInternalWindows();
                        }
                    }
                }, 400);
            } else {
                // Попапы ЗАБЛОКИРОВАНЫ — сразу внутренние окна
                popupsBlocked = true;
                startInternalWindows();
            }
        }

        function writePopupContent(w, num) {
            try {
                w.document.write('<html><head><title>YOU ARE AN IDIOT</title></head><body style="background:black;color:red;font-family:monospace;text-align:center;padding-top:50px;"><h1 style="font-size:60px;animation:blink 0.4s infinite;">YOU ARE AN IDIOT</h1><p style="font-size:20px;">#' + num + '</p><button onclick="window.close()" style="font-size:20px;padding:15px 30px;margin-top:30px;background:red;color:white;border:none;cursor:pointer;">CLOSE ME</button><style>@keyframes blink{0%{color:red}50%{color:black}100%{color:red}}</style></body></html>');
            } catch(e) {}
        }

        // === Внутренние окна (если попапы не работают) ===
        function startInternalWindows() {
            createVirusWindow();
            internalInterval = setInterval(function() {
                if (windowCount >= MAX_WINDOWS) {
                    clearInterval(internalInterval);
                    return;
                }
                createVirusWindow();
            }, 400);
        }

        function createVirusWindow() {
            windowCount++;
            var win = document.createElement('div');
            win.className = 'virus-window';

            var maxX = window.innerWidth - 260;
            var maxY = window.innerHeight - 140;
            var x = Math.max(0, Math.floor(Math.random() * maxX));
            var y = Math.max(0, Math.floor(Math.random() * maxY));

            win.style.left = x + 'px';
            win.style.top = y + 'px';
            win.style.width = '240px';
            win.style.height = '120px';

            win.innerHTML = '<h2>YOU ARE AN IDIOT</h2><p>#' + windowCount + '</p>';

            win.onclick = function() {
                win.remove();
            };

            document.body.appendChild(win);
        }

        function stopEverything() {
            if (internalInterval) {
                clearInterval(internalInterval);
                internalInterval = null;
            }
            if (popupInterval) {
                clearInterval(popupInterval);
                popupInterval = null;
            }
            var wins = document.querySelectorAll('.virus-window');
            for (var i = 0; i < wins.length; i++) {
                wins[i].remove();
            }
            document.getElementById('stop-btn').style.display = 'none';
        }
    </script>
</body>
</html>
